name: 📜 Build Alpine Engine Images

on:
  push:
    branches:
      - stable

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/alpine-engine

jobs:
  tagging:
    name: 🏷️ Tagging the app
    runs-on: ubuntu-24.04
    steps:
      - name: 🐙 Git checkout
        uses: actions/checkout@v6
      - name: 📁 Make sure repository is latest
        run: git fetch --prune --unshallow
      - name: 🔖 Create tag
        uses: kangketikonlen/base-tagging@main
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_TYPE: ${{ github.event.repository.owner.type }}
          REPO_OWNER: ${{ github.event.repository.owner.name }}
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRESERVE_VERSION: 5
  build-images:
    name: 📦 Build & push images
    runs-on: ubuntu-latest
    needs: tagging

    steps:
      - name: 🐙 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      # -----------------------------
      # 1️⃣ Build & push LATEST image
      # -----------------------------
      - name: 📦 Build latest image
        run: |
          docker build \
            -f docker/latest.Dockerfile \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            .

      - name: 🛳️ Push latest image
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:latest

      # -----------------------------
      # 2️⃣ Build & push RUNTIME image
      # -----------------------------
      - name: 📦 Build runtime image
        run: |
          docker build \
            -f docker/runtime.Dockerfile \
            -t ghcr.io/${{ env.IMAGE_NAME }}:runtime \
            .

      - name: 🛳️ Push runtime image
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:runtime

      # -----------------------------
      # 3️⃣ Build & push BUILD image
      # -----------------------------
      - name: 📦 Build build-image
        run: |
          docker build \
            -f docker/build.Dockerfile \
            -t ghcr.io/${{ env.IMAGE_NAME }}:build \
            .

      - name: 🛳️ Push build image
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:build
